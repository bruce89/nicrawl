[project]
name = "nicrawl"
version = "0.13.0"
description = "Recolector local de ofertas con dos fuentes, SQLite y laboratorios de scraping y concurrencia"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "typer>=0.27.2,<0.28",
]

[project.scripts]
nicrawl = "nicrawl.cli:run"

[project.optional-dependencies]
agents = [
    "mcp>=2,<3",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.9,<0.17",
]

[tool.uv]
required-version = "==0.12.19"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".tools", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/nicrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
